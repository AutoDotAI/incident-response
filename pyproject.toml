[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "autodotai-incident-response"
version = "0.1.0"
description = "Bounded, adapter-driven incident responder for local RunGuard alerts"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "AutoDotAI"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
incident-response = "incident_response.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
